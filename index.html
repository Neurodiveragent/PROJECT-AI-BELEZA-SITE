<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b6b47">
    <meta
      name="description"
      content="Encontre uma cadeira para trabalhar ou disponibilize uma cadeira no seu salão."
    >
    <title>AI Beleza | Encontre ou disponibilize uma cadeira</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="landing" aria-labelledby="page-title">
      <h1 id="page-title" class="sr-only">
        Encontre uma cadeira para trabalhar ou disponibilize uma cadeira no seu salão
      </h1>

      <section class="landing-stage" aria-label="Conectamos salões e profissionais da beleza">
        <picture class="landing-picture">
          <source
            media="(min-width: 720px)"
            srcset="./assets/ai-beleza-cadeiras-profissionais-desktop.png"
          >
          <img
            src="./assets/ai-beleza-cadeiras-profissionais-mobile.png"
            alt="Salão com cadeiras disponíveis ao lado de um grupo diverso de profissionais da beleza"
            width="1024"
            height="1536"
            fetchpriority="high"
          >
        </picture>

        <a
          class="whatsapp-cta whatsapp-cta--chairs"
          href="https://wa.me/5511960241933?text=Ol%C3%A1%2C%20quero%20disponibilizar%20uma%20cadeira%20no%20meu%20sal%C3%A3o."
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Quero disponibilizar uma cadeira no meu salão pelo WhatsApp"
        >
          Quero disponibilizar uma cadeira
        </a>

        <a
          class="whatsapp-cta whatsapp-cta--professionals"
          href="https://wa.me/5511960241933?text=Ol%C3%A1%2C%20quero%20encontrar%20uma%20cadeira%20para%20trabalhar."
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Quero encontrar uma cadeira para trabalhar pelo WhatsApp"
        >
          Quero encontrar uma cadeira
        </a>
      </section>
    </main>
  </body>
</html>
